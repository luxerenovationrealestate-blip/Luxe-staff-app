<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxe Renovation — Учет времени и заказов</title>

    <!-- Иконки и манифест для приложения (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Firebase через CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        const FALLBACK_SITE = 'Lyngbyvej 83A, 2100 København Ø';
        let detectedSite = localStorage.getItem('luxe_auto_site') || FALLBACK_SITE;

        async function reverseAddress(lat, lng) {
          try {
            const r = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,
              { headers: { 'Accept-Language': 'da,ru,en' } }
            );
            if (!r.ok) throw new Error('geo');
            const d = await r.json();
            const a = d.address || {};
            const street = `${a.road || a.pedestrian || a.street || ''}${a.house_number ? ' ' + a.house_number : ''}`.trim();
            const city = `${a.postcode ? a.postcode + ' ' : ''}${a.city || a.town || a.village || a.suburb || ''}`.trim();
            return [street, city].filter(Boolean).join(', ') || d.display_name || `${lat}, ${lng}`;
          } catch {
            return `${lat}, ${lng}`;
          }
        }

        function saveDetectedSite(addr) {
          if (!addr) return;
          detectedSite = addr;
          localStorage.setItem('luxe_auto_site', addr);

          // Добавляем адрес в популярные ключи списков объектов в localStorage, если они есть
          ['sites', 'objects', 'addresses', 'workSites', 'luxe_sites'].forEach((key) => {
            try {
              const raw = localStorage.getItem(key);
              if (!raw) return;
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) {
                const exists = parsed.some((item) =>
                  typeof item === 'string'
                    ? item === addr
                    : (item && (item.name === addr || item.address === addr || item.title === addr))
                );
                if (!exists) {
                  parsed.unshift(typeof parsed[0] === 'string' ? addr : { id: String(Date.now()), name: addr, address: addr });
                  localStorage.setItem(key, JSON.stringify(parsed));
                }
              }
            } catch {}
          });
        }

        function refreshGPS() {
          if (!navigator.geolocation) return;
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const lat = Number(pos.coords.latitude.toFixed(6));
              const lng = Number(pos.coords.longitude.toFixed(6));
              const addr = await reverseAddress(lat, lng);
              saveDetectedSite(addr);
              autoFillSiteSelects(addr);
            },
            () => {},
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 15000 }
          );
        }

        function autoFillSiteSelects(addr = detectedSite) {
          document.querySelectorAll('select').forEach((sel) => {
            const hasEmptyOrPlaceholder =
              !sel.value ||
              sel.value.includes('Выберите') ||
              sel.value.includes('объект') ||
              sel.selectedIndex <= 0;

            if (!hasEmptyOrPlaceholder) return;

            // Если в списке есть реальный объект (не пустой и не плейсхолдер) — выбираем первый реальный
            const realOption = Array.from(sel.options).find(
              (o) => o.value && !o.value.includes('Выберите') && !o.disabled && o.textContent.trim() && !o.textContent.includes('Выберите')
            );
            if (realOption) {
              sel.value = realOption.value;
              sel.dispatchEvent(new Event('change', { bubbles: true }));
              return;
            }

            // Иначе добавляем определённый по GPS адрес и выбираем его
            const opt = document.createElement('option');
            opt.value = addr;
            opt.textContent = addr;
            sel.appendChild(opt);
            sel.value = addr;
            sel.dispatchEvent(new Event('change', { bubbles: true }));
          });
        }

        // Перехватываем alert("Выберите объект перед стартом смены!") и автоматически подставляем адрес
        const origAlert = window.alert.bind(window);
        window.alert = function (msg) {
          if (typeof msg === 'string' && msg.toLowerCase().includes('объект')) {
            autoFillSiteSelects(detectedSite);
            refreshGPS();
            return;
          }
          return origAlert(msg);
        };

        const observer = new MutationObserver(() => autoFillSiteSelects(detectedSite));
        observer.observe(document.body, { childList: true, subtree: true });

        saveDetectedSite(detectedSite);
        refreshGPS();
        setTimeout(() => autoFillSiteSelects(detectedSite), 600);
      })();
    </script>
  </body>
</html>
