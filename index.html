<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxe Renovation — Учет времени и заказов</title>

    <!-- Иконки и манифест для приложения (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Firebase через CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        let currentLiveAddress = '';
        let currentGeoData = null;
        let gpsPromise = null;

        function isCompanyAddress(str) {
          if (!str) return false;
          const s = String(str).toLowerCase();
          return s.includes('lyngbyvej 83a') || s.includes('2100 københavn ø') || s.includes('2100 kobenhavn o');
        }

        async function reverseAddress(lat, lng) {
          try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1`;
            const r = await fetch(url, { headers: { 'Accept-Language': 'da,ru,en' } });
            if (!r.ok) throw new Error('geo');
            const d = await r.json();
            const a = d.address || {};
            const street = `${a.road || a.pedestrian || a.street || a.footway || ''}${a.house_number ? ' ' + a.house_number : ''}`.trim();
            const city = `${a.postcode ? a.postcode + ' ' : ''}${a.city || a.town || a.village || a.suburb || a.municipality || ''}`.trim();
            const combined = [street, city].filter(Boolean).join(', ');
            return combined || d.display_name || `${lat}, ${lng}`;
          } catch {
            return `${lat}, ${lng}`;
          }
        }

        function saveDetectedSite(addr) {
          if (!addr || isCompanyAddress(addr) || addr.startsWith('Определяем')) return;
          currentLiveAddress = addr;
          localStorage.setItem('luxe_live_site', addr);

          ['sites', 'objects', 'addresses', 'workSites', 'luxe_sites'].forEach((key) => {
            try {
              const raw = localStorage.getItem(key);
              if (!raw) return;
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) {
                const filtered = parsed.filter((item) => {
                  const val = typeof item === 'string' ? item : (item && (item.name || item.address || item.title || ''));
                  return !isCompanyAddress(val);
                });
                const exists = filtered.some((item) =>
                  typeof item === 'string'
                    ? item === addr
                    : (item && (item.name === addr || item.address === addr || item.title === addr))
                );
                if (!exists) {
                  const sample = filtered[0];
                  filtered.unshift(
                    typeof sample === 'object' && sample !== null
                      ? { ...sample, id: sample.id || String(Date.now()), name: addr, address: addr, title: addr }
                      : addr
                  );
                }
                localStorage.setItem(key, JSON.stringify(filtered));
              }
            } catch {}
          });
        }

        function applyAddressToSelects(addr) {
          if (!addr || isCompanyAddress(addr)) return;
          document.querySelectorAll('select').forEach((sel) => {
            Array.from(sel.options).forEach((o) => {
              if (isCompanyAddress(o.value) || isCompanyAddress(o.textContent)) {
                o.remove();
              }
            });

            let opt = Array.from(sel.options).find((o) => o.value === addr || o.textContent.trim() === addr);
            if (!opt) {
              opt = document.createElement('option');
              opt.value = addr;
              opt.textContent = addr;
              sel.insertBefore(opt, sel.firstChild);
            }
            sel.value = opt.value;
            sel.dispatchEvent(new Event('change', { bubbles: true }));
          });
        }

        function fetchLiveGPS(forceFresh = false) {
          if (!forceFresh && gpsPromise) return gpsPromise;

          gpsPromise = new Promise((resolve) => {
            if (!navigator.geolocation) {
              const fallbackAddr = currentLiveAddress || 'Локация без GPS';
              const fallbackData = currentGeoData || { status: 'unavailable', address: fallbackAddr, label: fallbackAddr };
              resolve(fallbackData);
              return;
            }

            navigator.geolocation.getCurrentPosition(
              async (pos) => {
                const lat = Number(pos.coords.latitude.toFixed(6));
                const lng = Number(pos.coords.longitude.toFixed(6));
                const acc = Math.round(pos.coords.accuracy || 0);
                const addr = await reverseAddress(lat, lng);
                const finalAddr = addr && !isCompanyAddress(addr) ? addr : `${lat}, ${lng}`;
                const data = {
                  status: 'ok',
                  lat,
                  lng,
                  accuracy: acc,
                  address: finalAddr,
                  mapsUrl: `https://www.google.com/maps?q=${lat},${lng}`,
                  label: `${finalAddr} (${lat}, ${lng})`
                };
                currentGeoData = data;
                localStorage.setItem('luxe_live_geo', JSON.stringify(data));
                saveDetectedSite(finalAddr);
                applyAddressToSelects(finalAddr);
                gpsPromise = null;
                resolve(data);
              },
              () => {
                const fallbackAddr = currentLiveAddress || 'Локация (GPS не подтверждён)';
                const data = { status: 'denied', address: fallbackAddr, label: fallbackAddr };
                currentGeoData = data;
                gpsPromise = null;
                resolve(data);
              },
              { enableHighAccuracy: true, timeout: 9000, maximumAge: forceFresh ? 0 : 10000 }
            );
          });

          return gpsPromise;
        }

        // Штамп геопозиции и времени прямо на фото отчёта
        function stampPhotoWithGeo(file, geoInfo) {
          return new Promise((resolve) => {
            if (!file || !file.type || !file.type.startsWith('image/')) {
              resolve(file);
              return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
              const img = new Image();
              img.onload = () => {
                try {
                  const canvas = document.createElement('canvas');
                  canvas.width = img.width;
                  canvas.height = img.height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0);

                  const nowStr = new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
                  const line1 = `📍 ${geoInfo.address || 'Геолокация'}`;
                  const line2 = geoInfo.lat && geoInfo.lng
                    ? `GPS: ${geoInfo.lat}, ${geoInfo.lng} · ${nowStr}`
                    : `${geoInfo.label || ''} · ${nowStr}`;

                  const barHeight = Math.max(54, Math.round(canvas.height * 0.075));
                  ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
                  ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

                  const fontSize = Math.max(14, Math.round(barHeight * 0.28));
                  ctx.font = `600 ${fontSize}px sans-serif`;
                  ctx.fillStyle = '#fbbf24';
                  ctx.fillText(line1, 16, canvas.height - barHeight + fontSize + 6);

                  ctx.font = `400 ${Math.max(12, Math.round(fontSize * 0.85))}px sans-serif`;
                  ctx.fillStyle = '#f8fafc';
                  ctx.fillText(line2, 16, canvas.height - 10);

                  canvas.toBlob((blob) => {
                    if (!blob) {
                      resolve(file);
                      return;
                    }
                    const stampedFile = new File([blob], file.name || 'photo-report.jpg', {
                      type: blob.type || file.type || 'image/jpeg',
                      lastModified: Date.now()
                    });
                    resolve(stampedFile);
                  }, 'image/jpeg', 0.9);
                } catch {
                  resolve(file);
                }
              };
              img.onerror = () => resolve(file);
              img.src = ev.target.result;
            };
            reader.onerror = () => resolve(file);
            reader.readAsDataURL(file);
          });
        }

        function appendGeoToVisibleTextInputs(geoInfo) {
          const textToAdd = geoInfo.lat && geoInfo.lng
            ? `📍 ${geoInfo.address} (${geoInfo.lat}, ${geoInfo.lng})`
            : `📍 ${geoInfo.address}`;

          document.querySelectorAll('input[type="text"], textarea').forEach((el) => {
            const ph = (el.placeholder || '').toLowerCase();
            if (ph.includes('адрес') || ph.includes('описание') || ph.includes('комментар') || ph.includes('отчет') || ph.includes('отчёт')) {
              if (!el.value.includes(geoInfo.address) && !el.value.includes('📍')) {
                const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value')?.set
                  || Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value')?.set;
                const nextVal = el.value.trim() ? `${el.value.trim()} | ${textToAdd}` : textToAdd;
                if (setter) {
                  setter.call(el, nextVal);
                } else {
                  el.value = nextVal;
                }
                el.dispatchEvent(new Event('input', { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }
          });
        }

        function savePhotoReportGeoLog(geoInfo, fileName = 'photo-report') {
          try {
            const key = 'luxe_photo_geo_logs';
            const existing = JSON.parse(localStorage.getItem(key) || '[]');
            existing.unshift({
              id: String(Date.now()),
              fileName,
              address: geoInfo.address,
              lat: geoInfo.lat || null,
              lng: geoInfo.lng || null,
              mapsUrl: geoInfo.mapsUrl || null,
              createdAt: new Date().toISOString()
            });
            localStorage.setItem(key, JSON.stringify(existing.slice(0, 200)));

            if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0 && window.firebase.firestore) {
              window.firebase.firestore().collection('photo_reports_geo').add({
                fileName,
                address: geoInfo.address,
                lat: geoInfo.lat || null,
                lng: geoInfo.lng || null,
                mapsUrl: geoInfo.mapsUrl || null,
                createdAt: new Date().toISOString(),
                timestamp: Date.now()
              }).catch(() => {});
            }
          } catch {}
        }

        // При выборе фото в input[type="file"]
        document.addEventListener('change', async (e) => {
          const input = e.target;
          if (!input || input.type !== 'file' || !input.files || !input.files.length) return;

          const geoInfo = await fetchLiveGPS(true);
          appendGeoToVisibleTextInputs(geoInfo);

          const dt = new DataTransfer();
          let changed = false;
          for (const f of Array.from(input.files)) {
            if (f.type && f.type.startsWith('image/')) {
              const stamped = await stampPhotoWithGeo(f, geoInfo);
              dt.items.add(stamped);
              savePhotoReportGeoLog(geoInfo, f.name);
              changed = true;
            } else {
              dt.items.add(f);
            }
          }
          if (changed) {
            input.files = dt.files;
            input.dispatchEvent(new Event('change', { bubbles: true }));
          }
        }, true);

        // При клике на кнопки старта смены или отправки фотоотчёта
        document.addEventListener('click', async (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const label = (btn.textContent || '').trim().toLowerCase();
          if (label.includes('старт') || label.includes('начать') || label.includes('смен')) {
            const geoInfo = await fetchLiveGPS(true);
            applyAddressToSelects(geoInfo.address);
          } else if (label.includes('фото') || label.includes('отправ') || label.includes('сохран') || label.includes('добав')) {
            const hasFileInput = document.querySelector('input[type="file"]');
            if (hasFileInput) {
              const geoInfo = await fetchLiveGPS(true);
              appendGeoToVisibleTextInputs(geoInfo);
              savePhotoReportGeoLog(geoInfo, 'photo-report');
            }
          }
        }, true);

        const origAlert = window.alert.bind(window);
        window.alert = async function (msg) {
          if (typeof msg === 'string' && msg.toLowerCase().includes('объект')) {
            const geoInfo = await fetchLiveGPS(true);
            applyAddressToSelects(geoInfo.address);
            return;
          }
          return origAlert(msg);
        };

        const observer = new MutationObserver(() => {
          if (currentLiveAddress) {
            applyAddressToSelects(currentLiveAddress);
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        fetchLiveGPS(true);
      })();
    </script>
  </body>
</html>
